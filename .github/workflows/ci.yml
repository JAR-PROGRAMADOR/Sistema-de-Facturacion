name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Cuando exista package-lock.json (tras el primer npm install), cambiar a: npm ci
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
